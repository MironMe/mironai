<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mironai • Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #101b2d;
        --panel: rgba(14, 22, 38, 0.85);
        --line: rgba(255, 255, 255, 0.08);
        --text: #edf6ff;
        --muted: #9bb3c8;
        --primary: #6ee7ff;
        --primary-2: #8f7bff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top, rgba(110, 231, 255, 0.16), transparent 28%),
          linear-gradient(180deg, #040b15 0%, #091221 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
        margin-bottom: 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #06111d;
        font-weight: 900;
      }

      .user-menu {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .user-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: rgba(110, 231, 255, 0.08);
        border: 1px solid rgba(110, 231, 255, 0.18);
        border-radius: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.85rem;
      }

      .dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        backdrop-filter: blur(12px);
        transition: 0.2s ease;
      }

      .card:hover {
        border-color: rgba(110, 231, 255, 0.3);
        transform: translateY(-2px);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(110, 231, 255, 0.12), rgba(143, 123, 255, 0.12));
        color: var(--primary);
        font-size: 1.6rem;
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 1.3rem;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .card-stat {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .settings-card {
        grid-column: 1 / -1;
      }

      .settings-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        margin-top: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #06111d;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        font-size: 0.95rem;
        transition: 0.2s ease;
      }

      .settings-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(110, 231, 255, 0.3);
      }

      .arrow {
        font-size: 1.2rem;
      }

      .section-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
        margin-top: 40px;
      }

      @media (max-width: 640px) {
        .dash-grid {
          grid-template-columns: 1fr;
        }

        .settings-card {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">M</div>
          <span>Mironai Dashboard</span>
        </div>
        <div class="user-menu">
          <div class="user-badge">
            <div class="avatar">MR</div>
            <span>MironMe</span>
          </div>
        </div>
      </header>

      <h2 class="section-title">Welcome back</h2>

      <div class="dash-grid">
        <div class="card">
          <div class="card-header">
            <div>
              <h3>Credits</h3>
              <p>Your current balance</p>
            </div>
            <div class="card-icon">⚡</div>
          </div>
          <div class="card-stat">
            <div>
              <div class="stat-value">∞</div>
              <div class="stat-label">Zero Credit Mode</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3>Usage</h3>
              <p>This month</p>
            </div>
            <div class="card-icon">📊</div>
          </div>
          <div class="card-stat">
            <div>
              <div class="stat-value">42</div>
              <div class="stat-label">Prompts generated</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3>Projects</h3>
              <p>Active workspaces</p>
            </div>
            <div class="card-icon">📁</div>
          </div>
          <div class="card-stat">
            <div>
              <div class="stat-value">3</div>
              <div class="stat-label">Projects running</div>
            </div>
          </div>
        </div>

        <div class="card settings-card">
          <div class="card-header">
            <div>
              <h3>Site Settings</h3>
              <p>Manage your domain, appearance, and account preferences.</p>
            </div>
            <div class="card-icon">⚙️</div>
          </div>
          <a href="settings.html" class="settings-link">
            Go to Settings
            <span class="arrow">→</span>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
